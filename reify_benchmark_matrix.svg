<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .serif { font-family: "Georgia", "Times New Roman", serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Background Warm Bone / Stone Paper -->
  <rect width="1200" height="675" fill="#e5e3dc"/>

  <!-- Outer Hairline Border -->
  <rect x="24" y="24" width="1152" height="627" rx="16" fill="#f0eee8" stroke="#d5d2c7" stroke-width="1.5"/>

  <!-- Header -->
  <text x="64" y="70" class="mono" font-size="12" letter-spacing="2" fill="#75736b" font-weight="600">TABLE 1 · SHALIGRAM LABS BENCHMARK SUITE</text>
  <text x="64" y="108" class="serif" font-size="32" font-weight="bold" fill="#141414">Empirical Performance Across 20 Web Applications</text>
  <text x="64" y="136" class="sans" font-size="14" fill="#66635a">Comparing visual screenshot agents (VLM) vs. static MCP servers vs. Reify wire tool synthesis with Claude 3.5 Sonnet.</text>

  <!-- 3 Top Metric Highlight Cards -->
  <g transform="translate(64, 160)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="340" height="85" rx="12" fill="#141414"/>
    <text x="24" y="32" class="mono" font-size="11" fill="#a09d94" letter-spacing="1">CONTEXT EVICTION</text>
    <text x="24" y="68" class="sans" font-size="28" font-weight="bold" fill="#ffffff">380 <tspan font-size="16" font-weight="normal" fill="#52e0a2">(-98.4%)</tspan></text>
    <text x="316" y="55" class="mono" font-size="12" fill="#8a877d" text-anchor="end">vs 24.1k tok</text>

    <!-- Card 2 -->
    <rect x="365" y="0" width="340" height="85" rx="12" fill="#141414"/>
    <text x="389" y="32" class="mono" font-size="11" fill="#a09d94" letter-spacing="1">DISPATCH LATENCY</text>
    <text x="389" y="68" class="sans" font-size="28" font-weight="bold" fill="#ffffff">4.1 µs <tspan font-size="16" font-weight="normal" fill="#52e0a2">(>240k req/s)</tspan></text>
    <text x="681" y="55" class="mono" font-size="12" fill="#8a877d" text-anchor="end">in-process</text>

    <!-- Card 3 -->
    <rect x="730" y="0" width="342" height="85" rx="12" fill="#141414"/>
    <text x="754" y="32" class="mono" font-size="11" fill="#a09d94" letter-spacing="1">TASK COMPLETION RATE</text>
    <text x="754" y="68" class="sans" font-size="28" font-weight="bold" fill="#ffffff">92.5% <tspan font-size="16" font-weight="normal" fill="#52e0a2">(+31.5%)</tspan></text>
    <text x="1048" y="55" class="mono" font-size="12" fill="#8a877d" text-anchor="end">vs 61.0% VLM</text>
  </g>

  <!-- Table Matrix Area -->
  <g transform="translate(64, 275)">
    <!-- Table Header Background -->
    <rect x="0" y="0" width="1072" height="42" rx="6" fill="#e8e5de"/>
    <text x="24" y="26" class="mono" font-size="12" font-weight="bold" fill="#141414">METRIC</text>
    <text x="360" y="26" class="mono" font-size="12" font-weight="bold" fill="#75736b">VISUAL BROWSER-USE</text>
    <text x="640" y="26" class="mono" font-size="12" font-weight="bold" fill="#75736b">STATIC FULL MCP</text>
    <text x="900" y="26" class="mono" font-size="12" font-weight="bold" fill="#141414">★ REIFY (OURS)</text>

    <!-- Row 1: Context Tokens -->
    <line x1="0" y1="42" x2="1072" y2="42" stroke="#dedbd2" stroke-width="1"/>
    <text x="24" y="74" class="sans" font-size="14" font-weight="bold" fill="#141414">Initial Context Tokens</text>
    <text x="360" y="74" class="mono" font-size="13" fill="#b94a48">24,100 tokens</text>
    <text x="640" y="74" class="mono" font-size="13" fill="#75736b">18,450 tokens</text>
    <text x="900" y="74" class="mono" font-size="13" font-weight="bold" fill="#141414">380 tokens <tspan fill="#228654">(-98.4%)</tspan></text>

    <!-- Row 2: Cold Compile Latency -->
    <line x1="0" y1="92" x2="1072" y2="92" stroke="#dedbd2" stroke-width="1"/>
    <text x="24" y="124" class="sans" font-size="14" font-weight="bold" fill="#141414">Cold Tool Synthesis</text>
    <text x="360" y="124" class="mono" font-size="13" fill="#8a877d">—</text>
    <text x="640" y="124" class="mono" font-size="13" fill="#75736b">Manual (Days)</text>
    <text x="900" y="124" class="mono" font-size="13" font-weight="bold" fill="#141414">14.8 ms <tspan fill="#228654">(SSR Fast-Path)</tspan></text>

    <!-- Row 3: Warm Call Dispatch -->
    <line x1="0" y1="142" x2="1072" y2="142" stroke="#dedbd2" stroke-width="1"/>
    <text x="24" y="174" class="sans" font-size="14" font-weight="bold" fill="#141414">Warm Call Dispatch</text>
    <text x="360" y="174" class="mono" font-size="13" fill="#8a877d">—</text>
    <text x="640" y="174" class="mono" font-size="13" fill="#75736b">420.0 µs</text>
    <text x="900" y="174" class="mono" font-size="13" font-weight="bold" fill="#141414">4.1 µs <tspan fill="#228654">(In-Process)</tspan></text>

    <!-- Row 4: Per-Step Latency -->
    <line x1="0" y1="192" x2="1072" y2="192" stroke="#dedbd2" stroke-width="1"/>
    <text x="24" y="224" class="sans" font-size="14" font-weight="bold" fill="#141414">Per-Step Action Latency</text>
    <text x="360" y="224" class="mono" font-size="13" fill="#b94a48">22,400 ms (22.4s)</text>
    <text x="640" y="224" class="mono" font-size="13" fill="#75736b">320 ms</text>
    <text x="900" y="224" class="mono" font-size="13" font-weight="bold" fill="#141414">140 ms <tspan fill="#228654">(160× faster)</tspan></text>

    <!-- Row 5: Cost per 1,000 Tasks -->
    <line x1="0" y1="242" x2="1072" y2="242" stroke="#dedbd2" stroke-width="1"/>
    <text x="24" y="274" class="sans" font-size="14" font-weight="bold" fill="#141414">Cost Per 1,000 Tasks</text>
    <text x="360" y="274" class="mono" font-size="13" fill="#b94a48">$48.00</text>
    <text x="640" y="274" class="mono" font-size="13" fill="#75736b">$9.20</text>
    <text x="900" y="274" class="mono" font-size="13" font-weight="bold" fill="#141414">$0.12 <tspan fill="#228654">(-99.7%)</tspan></text>

    <!-- Row 6: CSS / DOM Drift Immunity -->
    <line x1="0" y1="292" x2="1072" y2="292" stroke="#dedbd2" stroke-width="1"/>
    <text x="24" y="324" class="sans" font-size="14" font-weight="bold" fill="#141414">CSS Drift Robustness</text>
    <text x="360" y="324" class="mono" font-size="13" fill="#b94a48">21.6% (fails on class rename)</text>
    <text x="640" y="324" class="mono" font-size="13" fill="#75736b">100.0%</text>
    <text x="900" y="324" class="mono" font-size="13" font-weight="bold" fill="#141414">100.0% <tspan fill="#228654">(Immune)</tspan></text>
  </g>

  <!-- Footer -->
  <text x="64" y="632" class="mono" font-size="11" fill="#75736b">SHALIGRAM LABS · KATHMANDU, NEPAL · shaligramlabs.vercel.app · github.com/qvost/reify</text>
</svg>