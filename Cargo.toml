[workspace]
members = ["crates/reify-core", "crates/reify-probe", "crates/reify-synth", "crates/reify-server", "crates/reify-cli", "crates/reify-bridge"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"
blake3 = "1.5"
url = { version = "2.5", features = ["serde"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.9"
http = "1.2"
base64 = "0.22"
uuid = { version = "1.11", features = ["v4", "serde"] }
jsonschema = { version = "0.61", default-features = false }
