[package]
name = "reify-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stateless mounted MCP HTTP server with drift recovery"

[dependencies]
reify-core = { path = "../reify-core" }
reify-probe = { path = "../reify-probe" }
reify-synth = { path = "../reify-synth" }
tokio = { workspace = true, features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
http.workspace = true
uuid.workspace = true
chrono.workspace = true
url.workspace = true
